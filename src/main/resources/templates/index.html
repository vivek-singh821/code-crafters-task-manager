<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CODE CRAFTERS | Task Manager</title>

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --primary: #65240b;
        --primary-dark: #d39c35;

        /* Dark olive-green background */
        --background: #d1edd3;

        /* Snowy-white cards */
        --surface: #ffffff;

        --text: #202b19;
        --muted: #68745b;
        --border: #dce2c9;
      }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: var(--background);
        color: #f1f5e9;
        line-height: 1.55;
      }
      header {
        background: linear-gradient(120deg, #5c7057, #917504);
        color: rgb(147, 16, 16);
        padding: 24px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        box-shadow: 0 5px 24px #17255420;
      }

      header h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 750;
        letter-spacing: -0.6px;
      }

      header p {
        margin: 6px 0 0;
        color: #dbeafe;
        font-size: 14px;
      }

      header form,
      .actions form {
        margin: 0;
      }

      main {
        max-width: 1100px;
        margin: 36px auto;
        padding: 0 24px;
      }

      main > h2 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.8px;
      }

      main > p {
        color: var(--muted);
        margin: 5px 0 25px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-bottom: 24px;
      }

      .stat,
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 5px 20px #18274b06;
      }

      .stat {
        padding: 22px 24px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }

      .stat strong {
        display: block;
        color: var(--text);
        font-size: 32px;
        margin-top: 5px;
        letter-spacing: -1px;
      }

      .panel {
        padding: 26px;
        margin-bottom: 24px;
      }

      .panel h2 {
        margin: 0 0 20px;
        font-size: 19px;
        letter-spacing: -0.3px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 650;
        margin-top: 10px;
        color: #374151;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #dce2ee;
        background: #fff;
        color: var(--text);
        border-radius: 9px;
        margin: 7px 0 13px;
        font: inherit;
        font-size: 14px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px #4f46e51a;
      }

      textarea {
        resize: vertical;
        min-height: 75px;
      }

      button,
      .btn {
        border: 0;
        padding: 10px 15px;
        border-radius: 9px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        transition:
          background 0.2s,
          transform 0.2s;
      }

      button:hover,
      .btn:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--primary);
        color: white;
      }

      .primary:hover {
        background: var(--primary-dark);
      }

      .delete {
        background: #fff0f0;
        color: #c53030;
      }

      .delete:hover {
        background: #ffe0e0;
      }

      .complete {
        background: #e6f8ee;
        color: #18794e;
      }

      .complete:hover {
        background: #d0f3df;
      }

      .edit {
        background: #fff5dc;
        color: #946200;
      }

      .edit:hover {
        background: #ffebbd;
      }

      .cancel {
        background: #edf0f5;
        color: #475569;
      }

      .logout {
        background: #ffffff17;
        color: white;
        border: 1px solid #ffffff55;
        padding: 10px 18px;
        white-space: nowrap;
      }

      .logout:hover {
        background: #ffffff2b;
      }

      .task {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        border: 1px solid var(--border);
        background: #fff;
        padding: 19px;
        border-radius: 12px;
        margin-top: 12px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .task:hover {
        border-color: #c7d2fe;
        box-shadow: 0 4px 14px #18274b08;
      }

      .task h3 {
        margin: 0 0 7px;
        font-size: 16px;
        overflow-wrap: anywhere;
      }

      .task p {
        color: var(--muted);
        margin: 0 0 10px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        flex-shrink: 0;
      }

      .badge {
        font-size: 11px;
        font-weight: 700;
        background: #eef2ff;
        color: #4338ca;
        padding: 5px 10px;
        border-radius: 20px;
        display: inline-block;
        margin: 2px 3px 2px 0;
      }

      .done {
        text-decoration: line-through;
        color: #94a3b8;
      }

      .search {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      .search input {
        margin: 0;
        min-width: 0;
      }

      .search button {
        min-width: 95px;
      }

      .empty {
        color: var(--muted);
        text-align: center;
        padding: 35px 15px;
        border: 1px dashed #d5dbea;
        border-radius: 12px;
        margin-top: 12px;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #818cf8;
        outline-offset: 3px;
      }

      @media (max-width: 700px) {
        header {
          padding: 20px;
        }

        header h1 {
          font-size: 20px;
        }

        main {
          margin: 25px auto;
          padding: 0 15px;
        }

        main > h2 {
          font-size: 24px;
        }

        .stats {
          gap: 10px;
        }

        .stat {
          padding: 15px;
          font-size: 12px;
        }

        .stat strong {
          font-size: 26px;
        }

        .panel {
          padding: 19px;
        }

        .task {
          align-items: flex-start;
          flex-direction: column;
          gap: 15px;
        }

        .actions {
          width: 100%;
        }

        .search button {
          min-width: auto;
        }
      }

      @media (max-width: 430px) {
        header {
          align-items: flex-start;
        }

        header h1 {
          font-size: 17px;
        }

        header p {
          font-size: 12px;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .stat strong {
          font-size: 24px;
        }

        .search {
          flex-direction: column;
        }

        .search button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div>
        <h1>✓ CODE CRAFTERS</h1>
        <p>
          Welcome, <strong th:text="${userName}">User</strong>
          | Online Task Management System
        </p>
      </div>

      <form action="/logout" method="post">
        <button class="logout" type="submit">Logout</button>
      </form>
    </header>

    <main>
      <h2>My Dashboard</h2>
      <p>Organize your work and get things done.</p>

      <div class="stats">
        <div class="stat">
          Total Tasks
          <strong th:text="${total}">0</strong>
        </div>
        <div class="stat">
          Completed
          <strong th:text="${completed}">0</strong>
        </div>
        <div class="stat">
          Pending
          <strong th:text="${total - completed}">0</strong>
        </div>
      </div>

      <section class="panel">
        <h2 th:text="${editTask != null} ? 'Edit Task' : 'Add New Task'">
          Add New Task
        </h2>

        <form th:if="${editTask == null}" action="/tasks/add" method="post">
          <label for="title">Task Title</label>
          <input
            id="title"
            name="title"
            placeholder="What needs to be done?"
            required
            maxlength="120"
          />

          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            placeholder="Add details (optional)"
            maxlength="500"
          ></textarea>

          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>

          <button class="primary" type="submit">+ Add Task</button>
        </form>

        <form
          th:if="${editTask != null}"
          th:action="@{/tasks/{id}/edit(id=${editTask.id})}"
          method="post"
        >
          <label for="editTitle">Task Title</label>
          <input
            id="editTitle"
            name="title"
            th:value="${editTask.title}"
            required
            maxlength="120"
          />

          <label for="editDescription">Description</label>
          <textarea
            id="editDescription"
            name="description"
            maxlength="500"
            th:text="${editTask.description}"
          ></textarea>

          <label for="editPriority">Priority</label>
          <select id="editPriority" name="priority">
            <option value="Low" th:selected="${editTask.priority == 'Low'}">
              Low
            </option>
            <option
              value="Medium"
              th:selected="${editTask.priority == 'Medium'}"
            >
              Medium
            </option>
            <option value="High" th:selected="${editTask.priority == 'High'}">
              High
            </option>
          </select>

          <button class="primary" type="submit">Save Changes</button>
          <a class="btn cancel" href="/tasks">Cancel</a>
        </form>
      </section>

      <section class="panel">
        <h2>Your Tasks</h2>

        <form class="search" action="/tasks" method="get">
          <input
            name="search"
            th:value="${search}"
            placeholder="Search tasks by title..."
          />
          <button class="primary" type="submit">Search</button>
        </form>

        <div th:if="${#lists.isEmpty(tasks)}" class="empty">
          No tasks found. Add a new task above!
        </div>

        <div class="task" th:each="task : ${tasks}">
          <div>
            <h3
              th:classappend="${task.completed} ? 'done' : ''"
              th:text="${task.title}"
            >
              Task title
            </h3>

            <p th:text="${task.description}">Description</p>
            <span class="badge" th:text="${task.priority}">Medium</span>
            <span
              class="badge"
              th:text="${task.completed} ? 'Completed' : 'Pending'"
            >
              Pending
            </span>
          </div>

          <div class="actions">
            <a
              class="btn edit"
              th:href="@{/tasks(search=${search},editId=${task.id})}"
            >
              Edit
            </a>

            <form
              th:action="@{/tasks/{id}/complete(id=${task.id})}"
              method="post"
            >
              <button
                class="complete"
                type="submit"
                th:text="${task.completed} ? 'Undo' : 'Done'"
              >
                Done
              </button>
            </form>

            <form
              th:action="@{/tasks/{id}/delete(id=${task.id})}"
              method="post"
              onsubmit="return confirm('Delete this task?');"
            >
              <button class="delete" type="submit">Delete</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
