<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | CODE CRAFTERS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #102a43, #164e63);
        color: #172033;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 410px;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 18px 50px #0003;
      }
      h1 {
        margin: 0 0 8px;
        color: #164e63;
      }
      .subtitle {
        color: #64748b;
        margin-bottom: 25px;
      }
      label {
        display: block;
        margin: 15px 0 7px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
      }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 13px;
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      .error {
        color: #b91c1c;
        background: #fee2e2;
        padding: 10px;
        border-radius: 8px;
      }
      .footer {
        margin-top: 20px;
        text-align: center;
        color: #64748b;
      }
      a {
        color: #0f766e;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>CODE CRAFTERS</h1>
      <p class="subtitle">Create your task manager account</p>

      <p class="error" th:if="${error}" th:text="${error}"></p>

      <form action="/register" method="post">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" required maxlength="100" />

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required maxlength="150" />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          required
        />

        <button type="submit">Create Account</button>
      </form>

      <p class="footer">Already registered? <a href="/login">Log in</a></p>
    </div>
  </body>
</html>
